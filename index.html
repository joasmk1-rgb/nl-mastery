<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NL Mastery Platform</title>
    <style>
        :root { --primary: #1cb0f6; --success: #58cc02; --wrong: #ff4b4b; --bg: #f7f7f7; --text: #4b4b4b; --gold: #ffc800; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; color: var(--text); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* Header & Stats */
        header { background: white; border-bottom: 2px solid #e5e5e5; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .xp-badge { background: var(--gold); color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }

        /* Navigation & Views */
        .view { display: none; flex-direction: column; align-items: center; padding: 20px; flex-grow: 1; overflow-y: auto; }
        .view.active { display: flex; }

        /* Dashboard Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; margin-top: 20px; }
        .card-menu { background: white; padding: 20px; border-radius: 15px; border: 2px solid #e5e5e5; text-align: center; cursor: pointer; transition: transform 0.2s; font-weight: bold; }
        .card-menu:active { transform: scale(0.95); }
        .card-menu.blue { border-color: var(--primary); color: var(--primary); }

        /* Apprentissage */
        .study-box { width: 90%; max-width: 400px; background: white; border-radius: 25px; border: 2px solid #e5e5e5; padding: 30px; text-align: center; position: relative; box-shadow: 0 6px 0 #e5e5e5; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #ccc; font-size: 1.1rem; margin: 15px 0; outline: none; text-align: center; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; }
        .btn-green { background: var(--success); box-shadow: 0 4px 0 #45a302; }
        .btn-gray { background: #e5e5e5; color: #afafaf; }
        .btn-red { background: var(--wrong); box-shadow: 0 4px 0 #c13a3a; }

        /* Memory */
        .memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .m-card { height: 80px; background: white; border: 2px solid #e5e5e5; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; text-align: center; cursor: pointer; padding: 6px; }
        .m-card.selected { background: var(--primary); color: white; }
        .m-card.matched { background: var(--success); color: white; opacity: 0.4; pointer-events: none; }
        .hidden { visibility: hidden; }

        .back-btn { align-self: flex-start; margin-bottom: 20px; background: none; border: none; color: var(--primary); font-weight: bold; cursor: pointer; }

        #ta-timer { font-size: 2rem; font-weight: bold; color: var(--wrong); margin-bottom: 10px; }
        #ta-score { font-weight: bold; margin-bottom: 20px; }
        #load-error { color: var(--wrong); font-size: 0.85rem; margin-top: 10px; white-space: pre-line; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 1.2rem;">NL <span style="color:var(--primary)">Mastery</span></div>
        <div class="xp-badge" id="cecr-badge">A1 • 0%</div>
    </header>

    <div id="home-view" class="view active">
        <h2>Que veux-tu bosser ?</h2>
        <div class="grid">
            <div class="card-menu blue" onclick="startSession('VERBENL')">Verbes</div>
            <div class="card-menu blue" onclick="startSession('NOMNL')">Noms</div>
            <div class="card-menu blue" onclick="startSession('ADJNL')">Adjectifs</div>
            <div class="card-menu blue" onclick="startSession('PHRASES_LABO')">Phrases Labo</div>
        </div>
        <h2 style="margin-top:40px;">Jeux & Défis</h2>
        <div class="grid">
            <div class="card-menu" style="color:var(--success)" onclick="startMemory()">🧩 Memory</div>
            <div class="card-menu" style="color:var(--wrong)" onclick="showTASelect()">⏱️ Contre-la-montre</div>
        </div>
        <div class="grid" style="margin-top:15px;">
            <div class="card-menu" style="color:#8b5cf6; grid-column: span 2;" onclick="showProfil()">👤 Profil & Stats</div>
        </div>
        <div id="theme-section" style="width:100%; max-width:500px;"></div>
        <div id="load-error"></div>
    </div>

    <div id="study-view" class="view">
        <button class="back-btn" onclick="showHome()">← Retour</button>
        <div class="study-box">
            <small id="session-title"></small>
            <h1 id="q-text">Mots</h1>
            <input type="text" id="ans-input" placeholder="Traduire en Néerlandais...">
            <div id="feedback" style="min-height: 20px; font-weight: bold; margin-bottom: 10px;"></div>
            <button class="btn btn-green" onclick="checkAns()">VÉRIFIER</button>
            <button class="btn btn-gray" onclick="nextQ()">PASSER</button>
        </div>
    </div>

    <div id="memory-view" class="view">
        <button class="back-btn" onclick="showHome()">← Retour</button>
        <div id="memory-stats" style="font-weight:bold; margin-bottom:10px;"></div>
        <div class="memory-grid" id="m-grid"></div>
        <div id="memory-result" style="margin-top:20px; width:100%; max-width:400px;"></div>
    </div>

    <div id="ta-select-view" class="view">
        <button class="back-btn" onclick="showHome()">← Retour</button>
        <h2>Choisis une durée</h2>
        <div class="grid">
            <div class="card-menu" style="color:var(--wrong)" onclick="startTimeAttack(30)">30 sec</div>
            <div class="card-menu" style="color:var(--wrong)" onclick="startTimeAttack(60)">1 min</div>
            <div class="card-menu" style="color:var(--wrong)" onclick="startTimeAttack(180)">3 min</div>
            <div class="card-menu" style="color:var(--wrong)" onclick="startTimeAttack(300)">5 min</div>
        </div>
    </div>

    <div id="timeattack-view" class="view">
        <button class="back-btn" onclick="showHome()">← Retour</button>
        <div id="ta-timer">30</div>
        <div id="ta-score">Score : 0</div>
        <div class="study-box">
            <h1 id="ta-q-text">Mots</h1>
            <input type="text" id="ta-ans-input" placeholder="Traduire en Néerlandais...">
            <div id="ta-feedback" style="min-height: 20px; font-weight: bold; margin-bottom: 10px;"></div>
            <button class="btn btn-red" onclick="checkTAAns()">VALIDER</button>
        </div>
    </div>

    <div id="profil-view" class="view">
        <button class="back-btn" onclick="showHome()">← Retour</button>
        <h2>👤 Profil & Stats</h2>
        <div id="profil-content" style="width:100%; max-width:450px;"></div>
    </div>

    <script>
        let fullDb = [];
        let sessionDb = [];
        let state = JSON.parse(localStorage.getItem('nl_platform_v1')) || { xp: 0, mastered: [] };
        // Migration douce : on ajoute les champs manquants sans écraser une sauvegarde existante
        if (!state.stats) {
            state.stats = { modeCounts: { classique: 0, memory: 0, timeattack: 0 }, wordSeen: {} };
        }
        if (!state.memoryHighScore) state.memoryHighScore = null; // { moves, timeSec }
        let currentItem = null;

        function seeWord(id) {
            state.stats.wordSeen[id] = (state.stats.wordSeen[id] || 0) + 1;
        }

        function bumpMode(mode) {
            state.stats.modeCounts[mode] = (state.stats.modeCounts[mode] || 0) + 1;
        }

        // Normalise pour comparer sans se faire piéger par accents/apostrophes/espaces
        function normalize(str) {
            return str
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlève les accents
                .replace(/['’´`]/g, "'") // uniformise les apostrophes
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function init() {
            // Fichiers de vocabulaire "de base" : obligatoires, erreur affichée si absents/vides
            const coreFiles = ['VERBENL.csv', 'NOMNL.csv', 'ADJNL.csv', 'PHRASES_LABO.csv', 'MOTS_LABO.csv'];
            // Fichiers de thèmes métier : optionnels. Ajoute simplement un CSV avec un de ces noms
            // (ou un nouveau nom dans cette liste) pour qu'il apparaisse automatiquement dans "Thèmes".
            const themeCandidates = [
                'THEME_BASE.csv', 'THEME_MARKETING.csv', 'THEME_FINANCE.csv',
                'THEME_COMPTABILITE.csv', 'THEME_LOGISTIQUE.csv', 'THEME_SUPPLYCHAIN.csv',
                'THEME_MANAGEMENT.csv', 'THEME_RH.csv'
            ];
            const errors = [];
            const loadedThemes = [];

            async function loadFile(f, isCore) {
                try {
                    const r = await fetch(f);
                    if (!r.ok) { if (isCore) errors.push(f + ' : HTTP ' + r.status); return 0; }
                    const t = await r.text();
                    let count = 0;
                    t.split(/\r?\n/).slice(1).forEach(l => {
                        if (!l.trim()) return;
                        const c = l.split(';');
                        if (c[1] && c[2] !== undefined) {
                            fullDb.push({ id: f + '_' + c[0], fr: c[1].trim(), nl: c[2].trim(), file: f.replace('.csv', '') });
                            count++;
                        }
                    });
                    if (count === 0 && isCore) errors.push(f + ' : chargé mais 0 ligne valide (vérifie le séparateur ";")');
                    return count;
                } catch (e) {
                    if (isCore) errors.push(f + ' : ' + e.message + ' (fichier manquant ou bloqué par CORS — sers l\'app via un serveur local, pas en double-clic file://)');
                    return 0;
                }
            }

            for (let f of coreFiles) await loadFile(f, true);
            for (let f of themeCandidates) {
                const count = await loadFile(f, false);
                if (count > 0) loadedThemes.push({ file: f.replace('.csv', ''), count });
            }

            if (errors.length) {
                document.getElementById('load-error').innerText = errors.join('\n');
            }
            renderThemes(loadedThemes);
            updateStats();
        }

        function renderThemes(themes) {
            const section = document.getElementById('theme-section');
            if (!themes.length) { section.innerHTML = ''; return; }
            const labels = {
                THEME_BASE: '📚 Base', THEME_MARKETING: '📣 Marketing', THEME_FINANCE: '💰 Finance',
                THEME_COMPTABILITE: '🧾 Comptabilité', THEME_LOGISTIQUE: '📦 Logistique',
                THEME_SUPPLYCHAIN: '🚚 Supply Chain', THEME_MANAGEMENT: '🧭 Management', THEME_RH: '👥 RH'
            };
            section.innerHTML = '<h2 style="margin-top:40px;">Thèmes métier</h2><div class="grid">' +
                themes.map(t => `<div class="card-menu blue" onclick="startSession('${t.file}')">${labels[t.file] || t.file} (${t.count})</div>`).join('') +
                '</div>';
        }

        function showHome() {
            stopTimeAttack();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('home-view').classList.add('active');
        }

        function startSession(category) {
            sessionDb = fullDb.filter(i => i.file === category);
            if (sessionDb.length === 0) { alert("Fichier " + category + " vide ou manquant."); return; }
            document.getElementById('session-title').innerText = category;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('study-view').classList.add('active');
            bumpMode('classique');
            save();
            nextQ();
        }

        function nextQ() {
            currentItem = sessionDb[Math.floor(Math.random() * sessionDb.length)];
            seeWord(currentItem.id);
            save();
            document.getElementById('q-text').innerText = currentItem.fr;
            document.getElementById('ans-input').value = "";
            document.getElementById('feedback').innerText = "";
            document.getElementById('ans-input').focus();
        }

        function markMastered(item) {
            if (!state.mastered.includes(item.id)) {
                state.mastered.push(item.id);
            }
        }

        // Un mot peut avoir plusieurs réponses valides séparées par "/", ex: "rep1/rep2"
        function getAcceptedAnswers(nl) {
            return nl.split('/').map(s => s.trim()).filter(Boolean);
        }

        // Distance de Levenshtein : nombre minimal de lettres à changer/ajouter/enlever
        // pour passer d'un mot à l'autre. Sert à détecter les fautes de frappe/orthographe.
        function levenshtein(a, b) {
            const m = a.length, n = b.length;
            if (m === 0) return n;
            if (n === 0) return m;
            let prev = Array.from({ length: n + 1 }, (_, j) => j);
            for (let i = 1; i <= m; i++) {
                let curr = [i];
                for (let j = 1; j <= n; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    curr[j] = Math.min(
                        prev[j] + 1,      // suppression
                        curr[j - 1] + 1,  // insertion
                        prev[j - 1] + cost // substitution
                    );
                }
                prev = curr;
            }
            return prev[n];
        }

        // Tolérance selon la longueur du mot : plus le mot est long, plus on tolère de fautes
        function toleranceFor(word) {
            if (word.length >= 9) return 2;
            if (word.length >= 4) return 1;
            return 0;
        }

        // Compare la réponse de l'utilisateur à la liste des réponses acceptées.
        // Renvoie { status: 'correct' | 'close' | 'wrong', closest, distance }
        function evaluateAnswer(userRaw, nl) {
            const user = normalize(userRaw);
            const accepted = getAcceptedAnswers(nl);
            let best = { status: 'wrong', closest: accepted[0], distance: Infinity };
            for (const a of accepted) {
                const target = normalize(a);
                const dist = levenshtein(user, target);
                if (dist === 0) return { status: 'correct', closest: a, distance: 0 };
                if (dist <= toleranceFor(target) && dist < best.distance) {
                    best = { status: 'close', closest: a, distance: dist };
                } else if (dist < best.distance && best.status === 'wrong') {
                    best = { status: 'wrong', closest: a, distance: dist };
                }
            }
            return best;
        }

        function checkAns() {
            const raw = document.getElementById('ans-input').value;
            const accepted = getAcceptedAnswers(currentItem.nl);
            const multi = accepted.length > 1;
            const result = evaluateAnswer(raw, currentItem.nl);
            const fb = document.getElementById('feedback');

            if (result.status === 'correct') {
                fb.innerText = "✅ BRAVO ! → " + currentItem.nl + (multi ? "  (plusieurs réponses acceptées)" : "");
                fb.style.color = "var(--success)";
                state.xp += 10;
                markMastered(currentItem);
                save();
                setTimeout(nextQ, 1400);
            } else if (result.status === 'close') {
                fb.innerText = "🟡 PRESQUE ! (petite faute) → " + currentItem.nl;
                fb.style.color = "var(--gold)";
                state.xp += 5;
                markMastered(currentItem);
                save();
                setTimeout(nextQ, 1600);
            } else {
                fb.innerText = "❌ RÉPONSE" + (multi ? "S POSSIBLES : " : " : ") + currentItem.nl;
                fb.style.color = "var(--wrong)";
            }
        }

        // MEMORY GAME
        let memMoves = 0;
        let memStartTime = null;
        let memMatchedPairs = 0;
        let memTotalPairs = 6;

        function startMemory() {
            if (fullDb.length < 6) { alert("Pas assez de mots chargés pour jouer au Memory."); return; }
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('memory-view').classList.add('active');
            document.getElementById('memory-result').innerHTML = '';
            bumpMode('memory');

            const grid = document.getElementById('m-grid'); grid.innerHTML = "";
            let items = [...fullDb].sort(() => 0.5 - Math.random()).slice(0, 6);
            items.forEach(i => seeWord(i.id));
            save();

            let cards = []; items.forEach(i => { cards.push({ t: i.fr, id: i.id }, { t: i.nl, id: i.id }); });
            cards.sort(() => 0.5 - Math.random());

            memMoves = 0;
            memMatchedPairs = 0;
            memTotalPairs = items.length;
            memStartTime = Date.now();
            updateMemoryStatsLine();

            let selected = [];
            let lock = false;
            cards.forEach(c => {
                let d = document.createElement('div'); d.className = 'm-card'; d.innerText = c.t;
                d.onclick = () => {
                    if (lock || selected.length >= 2 || d.classList.contains('selected') || d.classList.contains('matched')) return;
                    d.classList.add('selected'); selected.push({ el: d, id: c.id });
                    if (selected.length === 2) {
                        lock = true;
                        memMoves++;
                        updateMemoryStatsLine();
                        if (selected[0].id === selected[1].id) {
                            setTimeout(() => {
                                selected.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add('matched'); });
                                selected = []; lock = false;
                                memMatchedPairs++;
                                if (memMatchedPairs >= memTotalPairs) finishMemory();
                            }, 400);
                            state.xp += 5; save();
                        } else {
                            setTimeout(() => {
                                selected.forEach(s => s.el.classList.remove('selected'));
                                selected = []; lock = false;
                            }, 800);
                        }
                    }
                };
                grid.appendChild(d);
            });
        }

        function updateMemoryStatsLine() {
            const best = state.memoryHighScore;
            const bestText = best ? `Meilleur score : ${best.moves} coups en ${best.timeSec}s` : 'Meilleur score : —';
            document.getElementById('memory-stats').innerText = `Coups : ${memMoves} — ${bestText}`;
        }

        function finishMemory() {
            const timeSec = Math.round((Date.now() - memStartTime) / 1000);
            const best = state.memoryHighScore;
            let isNewBest = false;
            if (!best || memMoves < best.moves || (memMoves === best.moves && timeSec < best.timeSec)) {
                state.memoryHighScore = { moves: memMoves, timeSec };
                isNewBest = true;
            }
            save();
            updateMemoryStatsLine();
            document.getElementById('memory-result').innerHTML = `
                <div class="study-box">
                    <h2>${isNewBest ? '🏆 Nouveau record !' : 'Terminé !'}</h2>
                    <p>${memMoves} coups, ${timeSec} secondes</p>
                    <button class="btn btn-green" onclick="startMemory()">🔁 REJOUER</button>
                    <button class="btn btn-gray" onclick="showHome()">Retour au menu</button>
                </div>`;
        }

        // TIME ATTACK (contre-la-montre)
        let taInterval = null;
        let taTimeLeft = 30;
        let taDuration = 30;
        let taScore = 0;
        let taCurrent = null;

        function showTASelect() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('ta-select-view').classList.add('active');
        }

        function startTimeAttack(durationSec) {
            if (fullDb.length === 0) { alert("Aucun mot chargé pour jouer."); return; }
            taDuration = durationSec || 30;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('timeattack-view').classList.add('active');
            bumpMode('timeattack');
            taScore = 0;
            taTimeLeft = taDuration;
            document.getElementById('ta-score').innerText = 'Score : 0';
            document.getElementById('ta-timer').innerText = taTimeLeft;
            document.getElementById('ta-feedback').innerText = '';
            nextTAQ();
            document.getElementById('ta-ans-input').focus();

            clearInterval(taInterval);
            taInterval = setInterval(() => {
                taTimeLeft--;
                document.getElementById('ta-timer').innerText = taTimeLeft;
                if (taTimeLeft <= 0) {
                    endTimeAttack();
                }
            }, 1000);
        }

        function nextTAQ() {
            taCurrent = fullDb[Math.floor(Math.random() * fullDb.length)];
            seeWord(taCurrent.id);
            save();
            document.getElementById('ta-q-text').innerText = taCurrent.fr;
            document.getElementById('ta-ans-input').value = '';
        }

        function checkTAAns() {
            if (!taCurrent) return;
            const raw = document.getElementById('ta-ans-input').value;
            const result = evaluateAnswer(raw, taCurrent.nl);
            const fb = document.getElementById('ta-feedback');
            if (result.status === 'correct') {
                taScore++;
                state.xp += 3;
                markMastered(taCurrent);
                save();
                document.getElementById('ta-score').innerText = 'Score : ' + taScore;
                fb.innerText = '✅ ' + taCurrent.nl;
                fb.style.color = 'var(--success)';
            } else if (result.status === 'close') {
                taScore += 0.5;
                state.xp += 1;
                markMastered(taCurrent);
                save();
                document.getElementById('ta-score').innerText = 'Score : ' + taScore;
                fb.innerText = '🟡 presque : ' + taCurrent.nl;
                fb.style.color = 'var(--gold)';
            } else {
                fb.innerText = '❌ ' + taCurrent.nl;
                fb.style.color = 'var(--wrong)';
            }
            nextTAQ();
        }

        function endTimeAttack() {
            clearInterval(taInterval);
            taInterval = null;
            const relancer = confirm("Temps écoulé ! Score final : " + taScore + "\n\nRejouer avec la même durée ?");
            if (relancer) {
                startTimeAttack(taDuration);
            } else {
                showHome();
            }
        }

        function stopTimeAttack() {
            if (taInterval) { clearInterval(taInterval); taInterval = null; }
        }

        // PROFIL & STATS
        function showProfil() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('profil-view').classList.add('active');
            renderProfil();
        }

        function renderProfil() {
            const mc = state.stats.modeCounts;
            const seenEntries = Object.entries(state.stats.wordSeen);
            const totalDistinctSeen = seenEntries.length;
            const top5 = [...seenEntries].sort((a, b) => b[1] - a[1]).slice(0, 5)
                .map(([id, count]) => {
                    const item = fullDb.find(i => i.id === id);
                    return item ? `${item.fr} → ${item.nl} (${count}x)` : `${id} (${count}x)`;
                });
            const best = state.memoryHighScore;
            const vp = getVocabProgress();

            document.getElementById('profil-content').innerHTML = `
                <div class="study-box" style="text-align:left;">
                    <h3>📊 Niveau CECR</h3>
                    <p>Niveau estimé : <b>${vp.level}</b> (${vp.pct}% du vocabulaire maîtrisé)<br>
                    Mots maîtrisés : ${vp.masteredVocab} / ${vp.totalVocab}<br>
                    Mots vus au moins une fois : ${totalDistinctSeen}</p>

                    <h3>🎮 Parties jouées</h3>
                    <p>Mode classique : ${mc.classique || 0}<br>
                    Memory : ${mc.memory || 0}<br>
                    Contre-la-montre : ${mc.timeattack || 0}</p>

                    <h3>🧩 Memory — meilleur score</h3>
                    <p>${best ? best.moves + ' coups en ' + best.timeSec + ' secondes' : 'Pas encore de partie terminée'}</p>

                    <h3>🔥 Mots les plus revus</h3>
                    <p>${top5.length ? top5.join('<br>') : 'Aucune donnée pour le moment'}</p>
                </div>`;
        }

        function save() {
            localStorage.setItem('nl_platform_v1', JSON.stringify(state));
            updateStats();
        }

        // Niveau CECR basé sur le % de vocabulaire distinct maîtrisé.
        // PHRASES_LABO est exclu du total : ce sont des phrases qui réutilisent des mots
        // déjà comptés ailleurs (verbes/noms/adjectifs/thèmes), donc les compter en plus fausserait le %.
        function getVocabProgress() {
            const vocabItems = fullDb.filter(i => i.file !== 'PHRASES_LABO');
            const totalVocab = vocabItems.length;
            const masteredVocab = vocabItems.filter(i => state.mastered.includes(i.id)).length;
            const pct = totalVocab > 0 ? Math.round((masteredVocab / totalVocab) * 100) : 0;
            let level = 'A1';
            if (pct >= 65) level = 'B2';
            else if (pct >= 35) level = 'B1';
            else if (pct >= 15) level = 'A2';
            return { pct, level, totalVocab, masteredVocab };
        }

        function updateStats() {
            const { pct, level } = getVocabProgress();
            document.getElementById('cecr-badge').innerText = level + ' • ' + pct + '%';
            document.getElementById('mastered-count') && (document.getElementById('mastered-count').innerText = state.mastered.length);
        }

        // Touche Enter
        document.getElementById('ans-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAns(); });
        document.getElementById('ta-ans-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkTAAns(); });

        init();
    </script>
</body>
</html>
